const rl=()=>Math.floor(Math.random()*3)-1;
function spawn(z){const r=Math.random();
if(r<.5){const n=1+(Math.random()<.4);[-1,0,1].sort(()=>Math.random()-.5).slice(0,n).forEach(l=>ents.push({l,z,t:Math.random()<.6?'car':'bar',k:Math.floor(Math.random()*3),c:CC[Math.floor(Math.random()*6)]}))}
else if(r<.62)ents.push({l:rl(),z,t:'ord'});
else{const l=rl();for(let i=0;i<4;i++)ents.push({l,z:z+i*3,t:'coin'})}}
function jump(){const V=VH[S.sel];if(mode=='play'&&jh==0){jv=V.v;jh=.001}}
function mv(d){if(mode=='play')lane=Math.max(-1,Math.min(1,lane+d))}
function upd(dt){const V=VH[S.sel];lvl=Math.floor(dist/700);if(lvl!=lastLvl){lastLvl=lvl;ban=3}
sp=Math.min(V.sp*1.5,V.sp+lvl*2+t*.08);dist+=sp*dt;t+=dt;
px+=(lane-px)*Math.min(1,dt*16);cam+=(px*.55-cam)*Math.min(1,dt*6);
if(jh>0){jh+=jv*dt;jv-=V.g*dt;if(jh<=0){jh=0;jv=0}}
if(V.sh&&!shield){shCd-=dt;if(shCd<=0){shield=1;toast='🛡️ الحماية رجعت!';tt=1.5}}
inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt*3);tt=Math.max(0,tt-dt);ban=Math.max(0,ban-dt);
while(nextZ<dist+VD){spawn(nextZ);nextZ+=Math.max(10,19-lvl*.8)}
for(const e of ents){const d=e.z-dist;if(e.dead||d>2.5||d<-2||Math.abs(e.l-px)>.55)continue;
if(e.t=='coin'){e.dead=1;earn+=5}
else if(e.t=='ord'){e.dead=1;const v=30+lvl*10;earn+=v;ords++;toast='📦 تم توصيل أوردر! +'+v+' ج';tt=1.2}
else if(inv>0||(V.fly&&jh>.25)||(e.t=='bar'&&jh>.3))continue;
else if(shield){shield=0;shCd=10;inv=1.6;e.dead=1;shake=1}
else{shake=1;over();return}}
ents=ents.filter(e=>!e.dead&&e.z-dist>-8)}

else if(k=='min'){[-.3,.25].forEach(a=>{const c=x+W*a;g.fillRect(c-u*.06,hy-u*1.1,u*.12,u*1.1);g.fillRect(c-u*.09,hy-u*.6,u*.18,u*.04);g.beginPath();g.arc(c,hy-u*1.1,u*.09,Math.PI,0);g.fill();g.fillRect(c-u*.01,hy-u*1.4,u*.02,u*.3)});g.beginPath();g.arc(x,hy,u*.45,Math.PI,0);g.fill()}
else if(k=='tow'){g.beginPath();g.moveTo(x-u*.12,hy);g.lineTo(x-u*.05,hy-u*1.2);g.lineTo(x+u*.05,hy-u*1.2);g.lineTo(x+u*.12,hy);g.fill();g.beginPath();g.ellipse(x,hy-u*1.3,u*.18,u*.12,0,0,7);g.fill();g.fillRect(x-u*.01,hy-u*1.7,u*.02,u*.4)}
else if(k=='mtn'){g.fillStyle='rgba(120,80,50,.28)';for(let i=-4;i<5;i++){const h=u*(.5+hs(i*2+1)*.7);g.beginPath();g.moveTo(x+i*u*.9-u*.7,hy);g.lineTo(x+i*u*.9,hy-h);g.lineTo(x+i*u*.9+u*.7,hy);g.fill()}}
else if(k=='tmp'){for(const a of[-.28,.28]){g.beginPath();g.moveTo(x+W*a-u*.35,hy);g.lineTo(x+W*a-u*.25,hy-u*.9);g.lineTo(x+W*a+u*.25,hy-u*.9);g.lineTo(x+W*a+u*.35,hy);g.fill()}g.beginPath();g.moveTo(x-u*.06,hy);g.lineTo(x,hy-u*1.6);g.lineTo(x+u*.06,hy);g.fill()}
else if(k=='nile'||k=='sea'){for(let i=-5;i<6;i++){const h=u*(.15+hs(i+3)*.3);g.fillRect(x+i*u*.4,hy-h,u*.3,h)}}
else{for(let i=-5;i<6;i++){const h=u*(.3+hs(i+lvl)*(k=='mod'?1.2:.7));g.fillRect(x+i*u*.35,hy-h,u*.28,h)}}}
function lamp(tp,x,y,s,ph){const u=LW*s*.04;g.fillStyle=tp=='orn'?'#1f3d2b':'#3a3a3a';
if(tp=='fan'){g.fillRect(x-u*.3,y-ph*.8,Math.max(1,u*.6),ph*.8);g.fillStyle='rgba(255,220,120,.5)';g.beginPath();g.arc(x,y-ph*.95,u*2.8,0,7);g.fill();g.fillStyle='#e9b800';g.beginPath();g.moveTo(x-u*1.3,y-ph*.82);g.lineTo(x+u*1.3,y-ph*.82);g.lineTo(x+u*.9,y-ph*1.1);g.lineTo(x-u*.9,y-ph*1.1);g.fill()}
else{g.fillRect(x-u*.3,y-ph,Math.max(1,u*.6),ph);g.fillStyle='#ffe9a6';g.beginPath();g.arc(x,y-ph,u*(tp=='mod'?.9:1.2),0,7);g.fill();if(tp=='orn'){g.beginPath();g.arc(x,y-ph*.82,u,0,7);g.fill()}}}
let SK,SKk='',VG,FG,FGk='';
function skyC(ti){const th=TH[ti],k=ti+'|'+W+'|'+H;if(SKk!=k){SKk=k;SK=mk(Math.round(W*1.3),Math.ceil(hy)+2,c=>{c.fillStyle=lg(c,0,0,0,hy,th.a,th.b);c.fillRect(0,0,W*1.3,hy+2);const sx=W*.93,sg2=c.createRadialGradient(sx,hy*.4,0,sx,hy*.4,hy*.5);sg2.addColorStop(0,'rgba(255,255,255,.85)');sg2.addColorStop(.3,'rgba(255,255,255,.35)');sg2.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=sg2;c.fillRect(0,0,W*1.3,hy);lm(th.lm,W*.65,c)})}return SK}
function draw(){const ti=curT(),th=TH[ti],nx=S.lock?ti:(ti+1)%TH.length;ens(ti);for(const k in BS)if(k!=ti&&k!=nx)delete BS[k];if(mode=='play'&&nx!=ti&&dist%700>250)ens(nx,1);g.save();
if(shake>0)g.translate((Math.random()-.5)*shake*W*.02,(Math.random()-.5)*shake*W*.02);
const z=1+Math.min(sp/300,.1)*(mode=='play'?1:0);g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2,-H/2);
g.fillStyle=th.a;g.fillRect(-W*.1,-H*.1,W*1.2,H*.1+4);g.drawImage(skyC(ti),-W*.15-cam*30,0);

g.fillStyle='rgba(255,255,255,.38)';for(let i=0;i<4;i++){const cx=(((i*.33-dist*.0002-cam*.02)%1.4+1.4)%1.4-.2)*W,cy=hy*(.18+i*.1);g.beginPath();g.ellipse(cx,cy,W*.09,hy*.035,0,0,7);g.fill();g.beginPath();g.ellipse(cx+W*.05,cy-hy*.02,W*.06,hy*.03,0,0,7);g.fill()}

g.fillStyle=th.gd;g.fillRect(-W*.1,hy,W*1.2,H);
if(th.w){g.fillStyle=lg(g,0,hy,0,H,'#2e7cc4','#1d5f9e');g.fillRect(-W*.1,hy,W*.6,H)}
const sb=(H-hy)/(by-hy)*1.15,sg=10,k=Math.floor(dist/sg),sc0=.0001;
quad(-1.5,1.5,sb,sc0,th.rd);quad(-1.9,-1.5,sb,sc0,'#a9a59c');quad(1.5,1.9,sb,sc0,'#a9a59c');
for(let i=12;i>=-1;i--){const d0=(i*sg-(dist%sg))/VD,sa=Math.min(sb,sOf(d0)),sc=Math.min(sb,sOf(d0+sg/VD)),on=(k+i)%2,sj=sa+(sc-sa)*.06;
if(on)quad(-1.5,1.5,sa,sc,'rgba(255,255,255,.035)');

if(th.cb=='s'){quad(-1.5,1.5,sa,sj,'rgba(0,0,0,.3)');quad(-.52,-.48,sa,sc,'rgba(0,0,0,.18)');quad(.48,.52,sa,sc,'rgba(0,0,0,.18)')}
else if(th.mk=='d'&&on){quad(-.53,-.47,sa,sc,'#ddd');quad(.47,.53,sa,sc,'#ddd')}
if(th.z&&(k+i)%14==0)for(let q=-1.4;q<1.4;q+=.4)quad(q,q+.22,sa,sc,'rgba(240,240,240,.9)');
const cc=th.cb=='y'?(on?'#f2c200':'#1a1a1a'):th.cb=='w'?(on?'#eee':'#999'):'#8a7a63';quad(-1.58,-1.5,sa,sc,cc);quad(1.5,1.58,sa,sc,cc);
quad(-1.9,-1.58,sa,sj,'rgba(0,0,0,.2)');quad(1.58,1.9,sa,sj,'rgba(0,0,0,.2)');
if(th.w){quad(-9,-1.9,sa,sc,on?'rgba(255,255,255,.1)':'rgba(0,0,0,.05)');quad(-1.93,-1.9,sa,sc,'#666')}}
const bp=16,k2=Math.floor(dist/bp),B=BS[ti];
for(let i=11;i>=0;i--){const d=(i*bp-(dist%bp))/VD,s=sOf(d),y=pr(0,s)[1],bw=LW*s*1.5;if(d<-.1)continue;
for(const sd of[-1,1]){const x=pr(sd*1.95,s)[0]-(sd<0?bw:0);if(!(th.w&&sd<0)){const sp2=B[Math.floor(hs(k2+i+sd*5)*6)],bh=bw*sp2.height/sp2.width;if(x+bw>-20&&x<W+20)g.drawImage(sp2,x,y-bh,bw,bh)}
const dx=pr(sd*1.7,s)[0],ph=LW*s*.9;
if((k2+i)%2==0){if(th.palm)g.drawImage(palmS,dx-ph*.27,y-ph*1.4,ph*.54,ph*1.4);else if(th.tree)g.drawImage(treeS,dx-ph*.4,y-ph*1.1,ph*.8,ph*1.1);else lamp(th.lp,dx,y,s,ph)}
else if(th.palm||th.tree)lamp(th.lp,dx,y,s,ph)}
if(th.dec&&(k2+i)%3==0&&s>.14){const xL=pr(-1.95,s)[0],xR=pr(1.95,s)[0],yT=y-LW*s*1.9,sg3=LW*s*.18,u=LW*s*.04;g.strokeStyle='#222';g.lineWidth=Math.max(1,u*.3);g.beginPath();g.moveTo(xL,yT);g.quadraticCurveTo((xL+xR)/2,yT+2*sg3,xR,yT);g.stroke();
for(let j=1;j<8;j++){const q=j/8,fx=xL+(xR-xL)*q,fy=yT+4*sg3*q*(1-q);if(j%2){g.fillStyle=['#e63946','#2a9d8f','#ffd60a','#4361ee'][j%4];g.beginPath();g.moveTo(fx-u,fy);g.lineTo(fx+u,fy);g.lineTo(fx,fy+u*2.2);g.fill()}else{g.fillStyle='rgba(255,210,90,.45)';g.beginPath();g.arc(fx,fy+u*1.6,u*2.4,0,7);g.fill();g.fillStyle='#e9b800';g.fillRect(fx-u*.8,fy+u*.6,u*1.6,u*2);g.fillStyle='#c1121f';g.fillRect(fx-u*.8,fy+u*1.6,u*1.6,u*.5)}}}}
const fh=(by-hy)*.22+4,fk=ti+'|'+Math.round(fh);if(FGk!=fk){FGk=fk;FG=mk(1,Math.ceil(fh),c=>{c.fillStyle=lg(c,0,0,0,fh,al(th.b,.95),al(th.b,0));c.fillRect(0,0,1,fh)})}g.drawImage(FG,-W*.1,hy-4,W*1.2,fh);
ents.sort((a,b)=>b.z-a.z);
for(const e of ents){const d=(e.z-dist)/VD;if(d>1||d<-.1)continue;const s=sOf(d),[x,y]=pr(e.l,s),w=LW*s;
if(e.t=='car'){const cw=w*.7,sp2=carS(e.k,e.c);g.drawImage(sp2,x-cw/2,y-cw*100/120*.96,cw,cw*100/120)}
else if(e.t=='bar'){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x-w*.34,y-w*.02,w*.68,w*.04);g.fillStyle='#fff';g.fillRect(x-w*.32,y-w*.22,w*.64,w*.16);g.fillStyle='#e63946';for(let i=0;i<4;i++)g.fillRect(x-w*.32+i*w*.16,y-w*.22,w*.08,w*.16);g.fillStyle='#555';g.fillRect(x-w*.3,y-w*.06,w*.05,w*.06);g.fillRect(x+w*.25,y-w*.06,w*.05,w*.06)}
else if(e.t=='coin'){const cr=g.createRadialGradient(x-w*.03,y-w*.31,0,x,y-w*.28,w*.1);cr.addColorStop(0,'#fff3a0');cr.addColorStop(1,'#e0a800');g.fillStyle=cr;g.beginPath();g.arc(x,y-w*.28,w*.09,0,7);g.fill();g.strokeStyle='#b8860b';g.lineWidth=Math.max(1,w*.015);g.stroke()}
else{const b=Math.sin(t*5)*w*.03;g.fillStyle='rgba(255,200,0,.35)';g.beginPath();g.arc(x,y-w*.3+b,w*.2,0,7);g.fill();g.fillStyle='#ff7b00';g.fillRect(x-w*.12,y-w*.4+b,w*.24,w*.2);g.fillStyle='rgba(255,255,255,.3)';g.fillRect(x-w*.12,y-w*.4+b,w*.24,w*.04);g.fillStyle='#fff';g.fillRect(x-w*.12,y-w*.31+b,w*.24,w*.03);g.fillRect(x-w*.015,y-w*.4+b,w*.03,w*.2)}}
player();g.restore();
if(!VG||VG.width!=W||VG.height!=H)VG=mk(W,H,c=>{const v=c.createRadialGradient(W/2,H*.55,H*.3,W/2,H*.55,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.35)');c.fillStyle=v;c.fillRect(0,0,W,H)});g.drawImage(VG,0,0);
if(tt>0){g.fillStyle='#fff';g.font='bold '+W*.05+'px Tahoma';g.textAlign='center';g.fillText(toast,W/2,H*.2)}
if(ban>0&&mode=='play'){g.globalAlpha=Math.min(1,ban);g.fillStyle='#ffd60a';g.font='bold '+Math.min(W*.06,50)+'px Tahoma';g.textAlign='center';g.fillText('المرحلة '+(lvl+1)+' — '+th.n,W/2,H*.14);g.globalAlpha=1}}
function player(){const V=VH[S.sel],[x,y0]=pr(px,1),ph=LW*1.15,pw=ph*220/300,fly=V.fly?H*.03*(1+Math.sin(t*6)*.3):0,lift=jh*H*(V.fly?.3:.2)+fly,y=y0-lift;
g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y0,pw*.3*(1-jh*.3),pw*.06,0,0,7);g.fill();
g.save();g.translate(x,y);g.rotate((lane-px)*.16);if(inv>0&&Math.floor(t*14)%2)g.globalAlpha=.4;
if(V.fly){g.fillStyle='rgba(0,229,255,.35)';for(const s of[-1,1]){g.beginPath();g.ellipse(s*pw*.3,0,pw*.1,pw*.05+Math.random()*3,0,0,7);g.fill()}}
g.drawImage(pls(S.sel==0&&mode=='play'?Math.floor(t*8)%2:0),-pw/2,-ph*.985,pw,ph);
if(shield){g.strokeStyle='#4cc9f0';g.lineWidth=3;g.beginPath();g.arc(0,-ph*.45,ph*.6,0,7);g.stroke()}
else if(V.sh&&mode=='play'){g.strokeStyle='rgba(76,201,240,.45)';g.lineWidth=3;g.beginPath();g.arc(0,-ph*.45,ph*.6,-Math.PI/2,-Math.PI/2+(1-Math.max(0,shCd)/10)*Math.PI*2);g.stroke()}
g.restore()}
let ac=0,cn=0;function loop(n){const rw=(n-last)/1000||0,dt=Math.min(.05,rw);last=n;if(mode=='play'){ac+=rw;if(++cn==60){if(ac/60>.026&&qs>.6){qs-=.15;rs()}ac=cn=0}}
if(mode=='play')upd(dt);
draw();if(mode=='play'&&++fr%8==0){const V=VH[S.sel];$('hm').textContent='💰 '+(S.money+earn)+' · 📦 '+ords+(V.sh?' · 🛡️'+(shield?' ✓':' '+Math.ceil(shCd)+'ث'):'');$('hl').textContent=TH[curT()].n+' · '+Math.floor(dist)+' م'}
requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')mv(-1);else if(k=='ArrowRight'||k=='d')mv(1);else if(k=='ArrowUp'||k=='w'||k==' ')jump();else if(k=='p'||k=='Escape')pause()});
let sx,sy;cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
cv.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy<-30)jump()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode=='play')pause()});
menu();requestAnimationFrame(loop);
</script></body></html>
